[env]
framework = arduino

[env:esp8266_generic]
platform = espressif8266
board = esp12e
; Los nodos ESP8266 tienen 1MB de flash real. El ldscript 1m64 hace que
; elf2bin escriba un encabezado flash de 1MB (nibble 0x2), de modo que el
; checkFlashConfig de Update.begin() (OTA) pase. NO usar el layout 4M en
; placas de 1MB: el boot header quedaria en 4MB y OTA se rechazaria con
; "ERROR[8] Flash config wrong". Placas de 4MB: eagle.flash.4m1m.ld.
board_build.ldscript = eagle.flash.1m64.ld
monitor_speed = 74880
platform_packages =
    framework-arduinoespressif8266 @ 3.30102.0

[env:esp32_devkit]
platform = espressif32@6.5.0
board = esp32dev
monitor_speed = 115200
build_flags = -Wl,-Map,firmware.map
extra_scripts = post:scripts/esp32_clean_reset.py

[env:esp32c3_devkit]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_flags = -Wl,-Map,firmware.map
extra_scripts = post:scripts/esp32_clean_reset.py
